<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HandWeChat 当前聊天</title>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f6f8;
      --surface: #ffffff;
      --surface-muted: #eef1f4;
      --border: #d8dee5;
      --text: #1d252c;
      --text-muted: #657180;
      --accent: #176b56;
      --accent-soft: #e3f2ed;
      --danger: #a4262c;
      --warning: #915c00;
      --shadow: 0 8px 24px rgba(25, 35, 44, 0.08);
      font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 16px;
      height: 100vh;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      flex: none;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand small {
      display: block;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 400;
    }

    .status-strip {
      display: grid;
      grid-template-columns: minmax(220px, 1.4fr) minmax(130px, 0.8fr) minmax(150px, 0.9fr) auto;
      gap: 16px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      align-items: center;
    }

    .chat-title {
      min-width: 0;
    }

    .chat-title span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 17px;
      font-weight: 700;
    }

    .field-label,
    .panel-title {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 5px 9px;
      border-radius: 6px;
      background: var(--surface-muted);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    .status-pill.online {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .status-pill.offline {
      color: var(--danger);
      background: #f7e9ea;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex: none;
    }

    .value {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }

    .icon-button:hover { background: var(--surface-muted); }
    .icon-button:disabled { color: #9aa3ad; cursor: not-allowed; }
    .icon-button.primary { color: var(--accent); border-color: #b8d8cd; background: var(--accent-soft); }
    .icon-button.stop { color: var(--danger); border-color: #e3c1c3; background: #f7e9ea; }
    .icon-button svg { width: 17px; height: 17px; }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 16px;
      min-height: 0;
    }

    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-title { margin: 0; font-size: 15px; color: var(--text); }

    .message-list {
      min-height: 0;
      overflow: auto;
      overflow-y: auto;
      scrollbar-gutter: stable;
      padding: 10px 16px 16px;
    }

    .message {
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      gap: 12px;
      padding: 10px 4px;
      border-bottom: 1px solid #e7eaee;
    }

    .message:last-child { border-bottom: 0; }
    .message.at-me { background: #fff8e3; }
    .message-meta { color: var(--text-muted); font-size: 12px; min-width: 0; }
    .message-meta strong {
      display: block;
      color: var(--text);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .message-self .message-meta strong { color: var(--accent); }

    .message-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .empty {
      min-height: 200px;
      display: grid;
      place-items: center;
      color: var(--text-muted);
      text-align: center;
      padding: 24px;
    }

    .side {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: 16px;
      min-height: 0;
    }

    .send-panel,
    .task-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .send-body {
      display: grid;
      gap: 10px;
      padding: 14px 16px 16px;
    }

    textarea {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      outline: none;
      font: inherit;
      color: var(--text);
    }

    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

    .send-actions {
      display: flex;
      justify-content: flex-end;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      border: 0;
      border-radius: 7px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .button:hover { filter: brightness(1.05); }
    .button:disabled { background: #9fada9; cursor: not-allowed; }
    .button svg { width: 16px; height: 16px; }

    .task-list {
      list-style: none;
      margin: 0;
      padding: 10px 12px 12px;
      overflow: auto;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .task {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: #fafbfc;
    }

    .task-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 12px;
    }

    .task-id { font-family: Consolas, monospace; font-size: 11px; }

    .badge {
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--surface-muted);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      flex: none;
    }

    .badge.success { color: #176b2d; background: #e4f3e8; }
    .badge.failed { color: var(--danger); background: #f7e9ea; }
    .badge.running { color: var(--warning); background: #f8edd7; }
    .task-text {
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow-wrap: anywhere;
    }

    .lookup {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      padding: 12px 16px 14px;
      border-top: 1px solid var(--border);
    }

    input {
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font: inherit;
    }

    .error-banner {
      display: none;
      padding: 9px 12px;
      border: 1px solid #e3c1c3;
      border-radius: 7px;
      background: #f7e9ea;
      color: var(--danger);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error-banner.show { display: block; }

    @media (max-width: 860px) {
      .app { padding: 12px; }
      .workspace { grid-template-columns: 1fr; }
      .status-strip { grid-template-columns: 1fr; gap: 10px; }
      .toolbar { justify-content: flex-start; }
      .side { grid-template-rows: auto minmax(260px, auto) minmax(180px, auto); }
      .message { grid-template-columns: 1fr; gap: 3px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark"><i data-lucide="message-circle"></i></div>
        <div>
          <h1>HandWeChat</h1>
          <small>只读取和发送当前聊天</small>
        </div>
      </div>
      <div class="toolbar">
        <button id="btn-attach" class="icon-button" type="button" title="重新附加微信" aria-label="重新附加微信">
          <i data-lucide="link"></i>
        </button>
        <button id="btn-start" class="icon-button primary" type="button" title="启动 OCR 监听" aria-label="启动 OCR 监听">
          <i data-lucide="play"></i>
        </button>
        <button id="btn-stop" class="icon-button stop" type="button" title="暂停 OCR 监听" aria-label="暂停 OCR 监听">
          <i data-lucide="square"></i>
        </button>
        <button id="btn-refresh" class="icon-button" type="button" title="立即刷新状态和消息" aria-label="立即刷新状态和消息">
          <i data-lucide="refresh-cw"></i>
        </button>
      </div>
    </header>

    <section class="status-strip" aria-label="当前聊天状态">
      <div class="chat-title">
        <div class="field-label">当前聊天</div>
        <span id="chat-title">未识别</span>
      </div>
      <div>
        <div class="field-label">连接状态</div>
        <div id="wechat-status" class="status-pill offline"><span class="dot"></span>检查中</div>
      </div>
      <div>
        <div class="field-label">OCR 监听</div>
        <div id="listener-status" class="status-pill"><span class="dot"></span>停止</div>
      </div>
      <div>
        <div class="field-label">聊天类型</div>
        <div id="chat-type" class="value">未知</div>
      </div>
    </section>

    <div id="error-banner" class="error-banner" role="alert"></div>

    <main class="workspace">
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">消息</h2>
          <span id="message-count" class="status-pill"><span class="dot"></span>0 条</span>
        </div>
        <div id="message-list" class="message-list">
          <div class="empty">启动 OCR 监听后显示当前聊天中的新文本消息</div>
        </div>
      </section>

      <div class="side">
        <section class="send-panel">
          <div class="panel-head"><h2 class="panel-title">发送到当前聊天</h2></div>
          <form id="send-form" class="send-body">
            <textarea id="send-text" placeholder="输入纯文本消息" aria-label="发送内容" required></textarea>
            <div class="send-actions">
              <button class="button" type="submit" id="send-button">
                <i data-lucide="send"></i>发送
              </button>
            </div>
          </form>
        </section>

        <section class="task-panel">
          <div class="panel-head">
            <h2 class="panel-title">发送任务</h2>
            <span id="task-count" class="status-pill"><span class="dot"></span>0 个</span>
          </div>
          <ul id="task-list" class="task-list">
            <li class="empty">暂无发送任务</li>
          </ul>
          <div class="lookup">
            <input id="task-id" type="text" placeholder="输入 task_id" aria-label="发送任务 ID">
            <button id="btn-lookup" class="icon-button" type="button" title="查询发送任务" aria-label="查询发送任务">
              <i data-lucide="search"></i>
            </button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script>
    "use strict";

    const elements = {
      attach: document.getElementById("btn-attach"),
      start: document.getElementById("btn-start"),
      stop: document.getElementById("btn-stop"),
      refresh: document.getElementById("btn-refresh"),
      chatTitle: document.getElementById("chat-title"),
      chatType: document.getElementById("chat-type"),
      wechatStatus: document.getElementById("wechat-status"),
      listenerStatus: document.getElementById("listener-status"),
      messageCount: document.getElementById("message-count"),
      messageList: document.getElementById("message-list"),
      sendForm: document.getElementById("send-form"),
      sendText: document.getElementById("send-text"),
      sendButton: document.getElementById("send-button"),
      taskId: document.getElementById("task-id"),
      taskLookup: document.getElementById("btn-lookup"),
      taskList: document.getElementById("task-list"),
      taskCount: document.getElementById("task-count"),
      errorBanner: document.getElementById("error-banner"),
    };

    const state = {
      cursor: 0,
      messageCount: 0,
      tasks: new Map(),
      refreshing: false,
    };

    function renderIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    function showError(error) {
      elements.errorBanner.textContent = error instanceof Error ? error.message : String(error);
      elements.errorBanner.classList.add("show");
    }

    function clearError() {
      elements.errorBanner.textContent = "";
      elements.errorBanner.classList.remove("show");
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.message || `${response.status} ${response.statusText}`);
      }
      return data;
    }

    function post(path, body) {
      return request(path, { method: "POST", body: JSON.stringify(body || {}) });
    }

    function setTypeText(element, value) {
      const text = value === "group" ? "群聊" : value === "friend" ? "私聊" : "未知";
      element.textContent = text;
    }

    function setPill(element, text, mode) {
      element.classList.remove("online", "offline");
      if (mode) element.classList.add(mode);
      element.textContent = "";
      const dot = document.createElement("span");
      dot.className = "dot";
      element.append(dot, document.createTextNode(text));
    }

    function renderHealth(data) {
      const online = Boolean(data.online);
      setPill(elements.wechatStatus, online ? "在线" : "离线", online ? "online" : "offline");
      setPill(elements.listenerStatus, data.listener_running ? "运行中" : "停止", data.listener_running ? "online" : undefined);
      elements.chatTitle.textContent = data.chat_title || "未识别";
      elements.chatTitle.title = data.chat_title || "";
      setTypeText(elements.chatType, data.chat_type);
      elements.start.disabled = !online || data.listener_running;
      elements.stop.disabled = !data.listener_running;
      elements.sendButton.disabled = !data.listener_running;
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "";
      return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function renderMessages(items) {
      if (items.length) {
        elements.messageList.querySelector(".empty")?.remove();
        for (const item of items) {
          elements.messageList.appendChild(renderMessage(item));
          state.messageCount += 1;
        }
      }
      setPill(elements.messageCount, `${state.messageCount} 条`, "online");
    }

    function renderMessage(item) {
      const row = document.createElement("article");
      row.className = `message${item.is_at_me ? " at-me" : ""}${item.sender === "我" ? " message-self" : ""}`;

      const meta = document.createElement("div");
      meta.className = "message-meta";
      const sender = document.createElement("strong");
      sender.textContent = item.sender || "未知";
      const time = document.createElement("span");
      time.textContent = formatTime(item.received_at);
      meta.append(sender, time);
      if (item.is_at_me) {
        const atMe = document.createElement("span");
        atMe.textContent = "@我";
        atMe.className = "badge running";
        meta.append(document.createElement("br"), atMe);
      }

      const content = document.createElement("div");
      content.className = "message-content";
      content.textContent = item.content;

      row.append(meta, content);
      return row;
    }

    function renderTasks() {
      const tasks = [...state.tasks.values()].sort((a, b) => (b.submitted_at || "").localeCompare(a.submitted_at || ""));
      elements.taskList.replaceChildren(...(tasks.length ? tasks.map(renderTask) : [createEmpty("暂无发送任务")]));
      setPill(elements.taskCount, `${tasks.length} 个`, "online");
    }

    function createEmpty(text) {
      const item = document.createElement("li");
      item.className = "empty";
      item.textContent = text;
      return item;
    }

    function renderTask(task) {
      const row = document.createElement("li");
      row.className = "task";
      const top = document.createElement("div");
      top.className = "task-top";
      const id = document.createElement("span");
      id.className = "task-id";
      id.textContent = task.task_id;
      const badge = document.createElement("span");
      badge.className = `badge ${task.status}`;
      badge.textContent = task.status;
      top.append(id, badge);

      const text = document.createElement("div");
      text.className = "task-text";
      text.textContent = task.text;
      text.title = task.text;
      row.append(top, text);
      if (task.error_message) {
        const error = document.createElement("div");
        error.className = "message-meta";
        error.textContent = task.error_message;
        row.append(error);
      }
      return row;
    }

    function upsertTask(task) {
      state.tasks.set(task.task_id, task);
      renderTasks();
    }

    async function refreshHealth() {
      try {
        const data = await request("/api/v1/health");
        renderHealth(data);
        clearError();
      } catch (error) {
        renderHealth({ online: false, listener_running: false, chat_title: "", chat_type: null });
        showError(error);
      }
    }

    async function refreshMessages() {
      try {
        const data = await request(`/api/v1/messages?cursor=${state.cursor}&limit=100&timeout=1`);
        renderMessages(data.items || []);
        state.cursor = data.next_cursor || state.cursor;
        clearError();
      } catch (error) {
        showError(error);
      }
    }

    async function attach() {
      setBusy(elements.attach, true);
      try {
        await post("/api/v1/attach");
        await refreshHealth();
      } catch (error) {
        showError(error);
      } finally {
        setBusy(elements.attach, false);
      }
    }

    async function setListener(running) {
      setBusy(elements.start, running);
      setBusy(elements.stop, !running);
      try {
        await post(running ? "/api/v1/listener/start" : "/api/v1/listener/stop");
        await refreshHealth();
      } catch (error) {
        showError(error);
      } finally {
        setBusy(elements.start, false);
        setBusy(elements.stop, false);
      }
    }

    async function submitMessage(event) {
      event.preventDefault();
      const text = elements.sendText.value.trim();
      if (!text) return;
      setBusy(elements.sendButton, true);
      try {
        const queued = await post("/api/v1/send", { text });
        upsertTask({ ...queued, text, submitted_at: new Date().toISOString() });
        elements.sendText.value = "";
        clearError();
      } catch (error) {
        showError(error);
      } finally {
        setBusy(elements.sendButton, false);
      }
    }

    async function lookupTask() {
      const taskId = elements.taskId.value.trim();
      if (!taskId) return;
      setBusy(elements.taskLookup, true);
      try {
        const task = await request(`/api/v1/send/${encodeURIComponent(taskId)}`);
        upsertTask(task);
        clearError();
      } catch (error) {
        showError(error);
      } finally {
        setBusy(elements.taskLookup, false);
      }
    }

    async function refreshAll() {
      if (state.refreshing) return;
      state.refreshing = true;
      setBusy(elements.refresh, true);
      try {
        await Promise.all([refreshHealth(), refreshMessages()]);
        await Promise.all([...state.tasks.keys()].map(async taskId => {
          try {
            const task = await request(`/api/v1/send/${encodeURIComponent(taskId)}`);
            if (task.status === "queued" || task.status === "running") upsertTask(task);
          } catch (_) {
            state.tasks.delete(taskId);
          }
        }));
        renderTasks();
      } finally {
        state.refreshing = false;
        setBusy(elements.refresh, false);
      }
    }

    function setBusy(button, busy) {
      if (button) button.disabled = Boolean(busy);
    }

    elements.attach.addEventListener("click", attach);
    elements.start.addEventListener("click", () => setListener(true));
    elements.stop.addEventListener("click", () => setListener(false));
    elements.refresh.addEventListener("click", refreshAll);
    elements.sendForm.addEventListener("submit", submitMessage);
    elements.taskLookup.addEventListener("click", lookupTask);
    elements.taskId.addEventListener("keydown", event => {
      if (event.key === "Enter") lookupTask();
    });

    renderIcons();
    renderTasks();
    refreshAll();
    setInterval(refreshHealth, 5000);
    setInterval(refreshMessages, 2000);
    window.addEventListener("online", refreshAll);
  </script>
</body>
</html>
