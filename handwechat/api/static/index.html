<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>HandWeChat Console</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f2f3f4;
      --surface: #ffffff;
      --surface-muted: #f7f8f8;
      --border: #d9dcdc;
      --border-strong: #b7bdbe;
      --text: #1e2223;
      --text-muted: #626a6c;
      --accent: #17627a;
      --accent-soft: #e2eff2;
      --success: #1a6b3c;
      --success-soft: #e2efe6;
      --warning: #8b4b10;
      --warning-soft: #f4e8d7;
      --danger: #922024;
      --danger-soft: #f5dfdf;
      --radius: 6px;
      font-family: "Microsoft YaHei UI", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 360px;
      background: var(--background);
      color: var(--text);
      font-size: 14px;
      line-height: 1.45;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button {
      min-height: 32px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: #edf0f0; }
    button:disabled { color: #8d9394; cursor: not-allowed; border-color: var(--border); }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button.primary:hover:not(:disabled) { background: #135265; }
    button.danger { color: var(--danger); }
    input, textarea {
      padding: 7px 9px;
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      background: var(--surface);
      outline: none;
    }
    input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px #d2e5eb; }
    textarea { resize: none; }

    .app {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      height: 100vh;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .brand {
      margin-right: 4px;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      white-space: nowrap;
    }
    .status-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      max-width: 240px;
      padding: 5px 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface-muted);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #a9b0b1; }
    .status-pill.online { background: var(--success-soft); color: var(--success); }
    .status-pill.online .status-dot { background: var(--success); }
    .status-pill.warn { background: var(--warning-soft); color: var(--warning); }
    .status-pill.warn .status-dot { background: var(--warning); }
    .status-pill.offline { background: var(--danger-soft); color: var(--danger); }
    .status-pill.offline .status-dot { background: var(--danger); }
    .status-text { overflow: hidden; text-overflow: ellipsis; }
    .top-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .workspace {
      display: grid;
      grid-template-columns: 330px minmax(0, 1fr);
      gap: 14px;
      padding: 14px;
      min-height: 0;
    }
    .sidebar {
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto;
      min-height: 0;
    }
    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
    }
    .sessions-panel { min-height: 0; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 44px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-muted);
    }
    .panel-title { font-weight: 700; }
    .panel-sub { margin-left: auto; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
    .session-tools { display: grid; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .search-row { display: flex; gap: 8px; }
    .search-row input { min-width: 0; flex: 1; }
    .segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 5px; background: var(--surface-muted); }
    .segmented button { min-height: 28px; padding: 0 6px; border: 0; background: transparent; color: var(--text-muted); }
    .segmented button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .session-list, .listener-list, .task-list {
      flex: 1;
      margin: 0;
      padding: 0;
      overflow: auto;
      list-style: none;
    }
    .session-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 4px 10px;
      padding: 9px 12px;
      border-bottom: 1px solid #eef0f0;
      cursor: pointer;
    }
    .session-item:hover { background: var(--surface-muted); }
    .session-item.active { background: var(--accent-soft); }
    .session-name { display: flex; align-items: center; gap: 6px; min-width: 0; font-weight: 600; }
    .session-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .session-preview {
      grid-column: 1 / 2;
      overflow: hidden;
      color: var(--text-muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-time { color: var(--text-muted); font-size: 12px; text-align: right; white-space: nowrap; }
    .tag {
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
      padding: 1px 5px;
      border-radius: 3px;
      background: #e8e9e9;
      color: #5d6465;
      font-size: 11px;
    }
    .tag.group { background: #dbe7ee; color: #22576d; }
    .tag.friend { background: #e2efe6; color: #1a6b3c; }
    .tag.at-me { background: #f5dfdf; color: #922024; font-weight: 700; }
    .unread-dot { width: 8px; height: 8px; border-radius: 50%; background: #c8454a; flex-shrink: 0; }
    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      color: var(--text-muted);
      text-align: center;
      padding: 16px;
    }
    .skeleton { padding: 10px 12px; border-bottom: 1px solid #eef0f0; }
    .skeleton-line { height: 12px; margin-bottom: 8px; background: linear-gradient(90deg, #eceeee, #f7f8f8, #eceeee); border-radius: 3px; }
    .skeleton-line:last-child { margin-bottom: 0; }

    .listener-panel { margin-top: 14px; max-height: 280px; }
    .listener-tools { display: flex; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .listener-tools input { min-width: 0; flex: 1; }
    .listener-list { max-height: 135px; }
    .listener-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 5px 12px;
      border-bottom: 1px solid #eef0f0;
    }
    .listener-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .listener-item button { min-height: 26px; padding: 0 8px; }

    .chat-column { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; min-width: 0; min-height: 0; }
    .message-panel { min-height: 0; }
    .message-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 44px;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface-muted);
    }
    .selected-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
    .message-stream { min-height: 0; flex: 1; padding: 14px; overflow: auto; background: var(--surface); }
    .message-row { max-width: 860px; margin: 0 0 12px; }
    .message-row.at-me { padding-left: 8px; border-left: 3px solid #c8454a; }
    .message-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
      color: var(--text-muted);
      font-size: 12px;
    }
    .message-session { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .bubble {
      display: inline-block;
      max-width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface-muted);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .at-me .bubble { border-color: #dcaeaf; background: #fbf2f2; }
    .send-box { padding: 12px; border-top: 1px solid var(--border); background: var(--surface); }
    .send-target { margin-bottom: 8px; color: var(--text-muted); font-size: 12px; }
    .send-input { width: 100%; min-height: 74px; }
    .send-actions { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }

    .tasks-panel { margin-top: 14px; max-height: 175px; }
    .task-list { max-height: 125px; }
    .task-item {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      padding: 5px 12px;
      border-bottom: 1px solid #eef0f0;
    }
    .task-status { padding: 1px 6px; border-radius: 3px; background: #e8e9e9; color: #5d6465; font-size: 11px; white-space: nowrap; }
    .task-status.running { background: #e2eff2; color: #17627a; }
    .task-status.success { background: #e2efe6; color: #1a6b3c; }
    .task-status.failed { background: #f5dfdf; color: #922024; }
    .task-detail { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .task-detail .error { color: var(--danger); }

    .error-strip {
      display: none;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      padding: 7px 16px;
      background: var(--danger-soft);
      color: var(--danger);
      border-bottom: 1px solid #dcbbbb;
    }
    .error-strip.show { display: flex; }
    .error-message { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .error-strip button { margin-left: auto; min-height: 26px; padding: 0 8px; }

    .context-menu {
      position: fixed;
      z-index: 1000;
      display: none;
      min-width: 132px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
    }
    .context-menu.open { display: block; }
    .context-menu button {
      width: 100%;
      min-height: 30px;
      justify-content: flex-start;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      text-align: left;
    }
    .context-menu button:hover:not(:disabled) { background: var(--accent-soft); }
    .context-menu button.danger { color: var(--danger); }
    .context-menu button.danger:hover:not(:disabled) { background: var(--danger-soft); }

    @media (max-width: 860px) {
      .workspace { grid-template-columns: 1fr; overflow: auto; }
      .sidebar { grid-template-rows: auto auto; }
      .sessions-panel { min-height: 360px; }
      .chat-column { grid-template-rows: 420px auto auto; min-height: 420px; }
      .status-strip { overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">HandWeChat</div>
      <div class="status-strip">
        <div id="status-health" class="status-pill offline"><i class="status-dot"></i><span class="status-text">未连接</span></div>
        <div id="status-pid" class="status-pill"><i class="status-dot"></i><span class="status-text">微信未在线</span></div>
        <div id="status-version" class="status-pill"><i class="status-dot"></i><span class="status-text">版本未知</span></div>
        <div id="status-listener" class="status-pill"><i class="status-dot"></i><span class="status-text">监听停止</span></div>
        <div id="status-queue" class="status-pill"><i class="status-dot"></i><span class="status-text">队列 0</span></div>
      </div>
      <div class="top-actions">
        <button id="btn-attach" type="button">附加</button>
        <button id="btn-sessions" type="button">刷新会话</button>
      </div>
    </header>

    <div id="error-strip" class="error-strip">
      <span class="error-message"></span>
      <button id="btn-close-error" type="button" aria-label="关闭错误">关闭</button>
    </div>

    <main class="workspace">
      <aside class="sidebar">
        <section class="panel sessions-panel">
          <div class="panel-head">
            <div class="panel-title">会话</div>
            <div id="session-count" class="panel-sub">0</div>
          </div>
          <div class="session-tools">
            <div class="search-row">
              <input id="session-search" type="search" placeholder="搜索会话" aria-label="搜索会话">
            </div>
            <div class="segmented" role="group" aria-label="会话类型">
              <button data-filter="all" class="active" type="button">全部</button>
              <button data-filter="friend" type="button">私聊</button>
              <button data-filter="group" type="button">群聊</button>
            </div>
          </div>
          <ul id="session-list" class="session-list"></ul>
        </section>

        <section class="panel listener-panel">
          <div class="panel-head">
            <div class="panel-title">监听</div>
            <div class="panel-sub">
              <button id="btn-listener-start" type="button">启动</button>
              <button id="btn-listener-stop" type="button">停止</button>
            </div>
          </div>
          <div class="listener-tools">
            <input id="listener-name" type="text" placeholder="输入会话名称" aria-label="输入会话名称">
            <button id="btn-listener-add" class="primary" type="button">添加</button>
          </div>
          <ul id="listener-list" class="listener-list"></ul>
        </section>
      </aside>

      <section class="chat-column">
        <div class="panel message-panel">
          <div class="message-head">
            <div id="selected-session" class="selected-name">未选择会话</div>
            <div id="message-state" class="panel-sub">等待新消息</div>
          </div>
          <div id="message-stream" class="message-stream"><div class="empty">暂无消息</div></div>
        </div>

        <div class="send-box">
          <div class="send-target">发送到 <span id="send-target-name">未选择</span></div>
          <textarea id="send-text" class="send-input" placeholder="输入纯文本消息" aria-label="消息内容"></textarea>
          <div class="send-actions">
            <button id="btn-send" class="primary" type="button">发送</button>
          </div>
        </div>

        <div class="panel tasks-panel">
          <div class="panel-head">
            <div class="panel-title">发送队列</div>
            <div id="task-count" class="panel-sub">0</div>
          </div>
          <ul id="task-list" class="task-list"><li class="empty">暂无任务</li></ul>
        </div>
      </section>
    </main>
  </div>

  <div id="session-context-menu" class="context-menu" role="menu">
    <button id="ctx-add-listener" type="button" role="menuitem">添加监听</button>
    <button id="ctx-remove-listener" type="button" role="menuitem" class="danger">移除监听</button>
  </div>

  <script>
    "use strict";

    const params = new URLSearchParams(location.search);
    const API_BASE = params.get("api") || (
      location.protocol === "http:" || location.protocol === "https:" ? "" : "http://127.0.0.1:8000"
    );
    const SESSIONS_CACHE_KEY = "handwechat.sessions.v1";
    const SESSIONS_CACHE_VERSION = 1;

    const elements = {
      health: document.getElementById("status-health"),
      pid: document.getElementById("status-pid"),
      version: document.getElementById("status-version"),
      listener: document.getElementById("status-listener"),
      queue: document.getElementById("status-queue"),
      attach: document.getElementById("btn-attach"),
      sessions: document.getElementById("btn-sessions"),
      sessionList: document.getElementById("session-list"),
      sessionSearch: document.getElementById("session-search"),
      sessionCount: document.getElementById("session-count"),
      listenerList: document.getElementById("listener-list"),
      listenerName: document.getElementById("listener-name"),
      listenerAdd: document.getElementById("btn-listener-add"),
      listenerStart: document.getElementById("btn-listener-start"),
      listenerStop: document.getElementById("btn-listener-stop"),
      selectedSession: document.getElementById("selected-session"),
      sendTargetName: document.getElementById("send-target-name"),
      sendText: document.getElementById("send-text"),
      send: document.getElementById("btn-send"),
      messageStream: document.getElementById("message-stream"),
      messageState: document.getElementById("message-state"),
      taskList: document.getElementById("task-list"),
      taskCount: document.getElementById("task-count"),
      contextMenu: document.getElementById("session-context-menu"),
      contextAdd: document.getElementById("ctx-add-listener"),
      contextRemove: document.getElementById("ctx-remove-listener"),
      errorStrip: document.getElementById("error-strip"),
      errorText: document.querySelector("#error-strip .error-message"),
      closeError: document.getElementById("btn-close-error"),
    };

    const state = {
      sessions: [],
      sessionFilter: "all",
      selectedSession: "",
      listenerSessions: [],
      messages: [],
      cursor: 0,
      tasks: new Map(),
      health: null,
      sessionsLoading: false,
      messagePolling: false,
      contextSession: "",
    };

    class ApiError extends Error {
      constructor(message, code) {
        super(message);
        this.code = code || "HTTP_ERROR";
      }
    }

    async function request(path, options = {}) {
      let response;
      try {
        response = await fetch(API_BASE + path, {
          ...options,
          headers: { Accept: "application/json", ...(options.headers || {}) },
        });
      } catch (error) {
        throw new ApiError(`无法连接 API：${API_BASE || "当前页面源"}`, "NETWORK_ERROR");
      }

      let payload = null;
      try { payload = await response.json(); } catch (_) {}
      if (!response.ok) {
        throw new ApiError(payload?.message || `HTTP ${response.status}`, payload?.code);
      }
      return payload;
    }

    function post(path, body) {
      return request(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
    }

    function showError(error) {
      elements.errorText.textContent = error instanceof Error ? error.message : String(error);
      elements.errorStrip.classList.add("show");
    }

    function clearError() {
      elements.errorStrip.classList.remove("show");
      elements.errorText.textContent = "";
    }

    function setPill(node, text, mode) {
      node.classList.remove("online", "warn", "offline");
      if (mode) node.classList.add(mode);
      node.querySelector(".status-text").textContent = text;
      node.title = text;
    }

    function setBusy(button, busy, text) {
      button.disabled = busy;
      if (text) button.textContent = text;
    }

    function renderHealth(data) {
      state.health = data;
      const healthMode = data.status === "ok" ? "online" : data.status === "degraded" ? "warn" : "offline";
      setPill(elements.health, data.status === "ok" ? "在线" : data.status === "degraded" ? "降级" : "离线", healthMode);
      setPill(elements.pid, data.online ? `PID ${data.wechat_pid}` : "微信未在线", data.online ? "online" : "offline");
      setPill(elements.version, data.online ? `微信 ${data.wechat_version || "未知"}` : "版本未知", data.online ? "online" : "offline");
      setPill(elements.listener, data.listener_running ? `监听 ${data.listener_session_count}` : "监听停止", data.listener_running ? "online" : undefined);
      setPill(elements.queue, `队列 ${data.send_queue_size}`, data.send_queue_size ? "warn" : undefined);

      elements.listenerStart.disabled = !data.online;
      elements.listenerStop.disabled = !data.online;
      elements.listenerAdd.disabled = !data.online;
      elements.send.disabled = !data.online;
      elements.attach.disabled = false;
      if (data.last_error) showError(new ApiError(data.last_error, "SERVICE_ERROR"));
    }

    async function refreshHealth() {
      try {
        renderHealth(await request("/api/v1/health"));
      } catch (error) {
        setPill(elements.health, "未连接", "offline");
        setPill(elements.pid, "微信未在线", "offline");
        setPill(elements.version, "版本未知", "offline");
        setPill(elements.listener, "监听停止", undefined);
        setPill(elements.queue, "队列 0", undefined);
        elements.listenerStart.disabled = true;
        elements.listenerStop.disabled = true;
        elements.listenerAdd.disabled = true;
        elements.send.disabled = true;
        elements.attach.disabled = false;
        showError(error);
      }
    }

    async function attach() {
      clearError();
      setBusy(elements.attach, true, "附加中...");
      try {
        await post("/api/v1/attach");
        await Promise.all([refreshHealth(), refreshListenerSessions()]);
      } catch (error) {
        showError(error);
      } finally {
        setBusy(elements.attach, false, "附加");
        await refreshHealth();
      }
    }

    function readSessionCache() {
      try {
        const raw = localStorage.getItem(SESSIONS_CACHE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (
          parsed?.version !== SESSIONS_CACHE_VERSION ||
          parsed?.api_base !== API_BASE ||
          !Array.isArray(parsed.items)
        ) {
          localStorage.removeItem(SESSIONS_CACHE_KEY);
          return null;
        }
        return parsed.items.filter(item => item && typeof item.name === "string");
      } catch (_) {
        try { localStorage.removeItem(SESSIONS_CACHE_KEY); } catch (_) {}
        return null;
      }
    }

    function writeSessionCache(items) {
      try {
        localStorage.setItem(SESSIONS_CACHE_KEY, JSON.stringify({
          version: SESSIONS_CACHE_VERSION,
          api_base: API_BASE,
          saved_at: new Date().toISOString(),
          items,
        }));
      } catch (_) {}
    }

    function renderSessions() {
      const keyword = elements.sessionSearch.value.trim().toLowerCase();
      const items = state.sessions.filter(item => {
        const typeOk = state.sessionFilter === "all" || item.type === state.sessionFilter;
        return typeOk && item.name.toLowerCase().includes(keyword);
      });
      elements.sessionCount.textContent = `${items.length} / ${state.sessions.length}`;
      elements.sessionList.replaceChildren();

      if (!items.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = state.sessions.length ? "没有匹配会话" : "尚未加载会话";
        elements.sessionList.append(empty);
        return;
      }

      for (const item of items) {
        const row = document.createElement("li");
        row.className = "session-item";
        row.dataset.name = item.name;
        if (item.name === state.selectedSession) row.classList.add("active");

        const nameWrap = document.createElement("div");
        nameWrap.className = "session-name";
        const name = document.createElement("span");
        name.textContent = item.name;
        nameWrap.append(name);
        if (item.unread) {
          const dot = document.createElement("i");
          dot.className = "unread-dot";
          nameWrap.append(dot);
        }
        const type = document.createElement("span");
        type.className = `tag ${item.type || ""}`;
        type.textContent = item.type === "group" ? "群聊" : item.type === "friend" ? "私聊" : "未知";
        nameWrap.append(type);

        const time = document.createElement("div");
        time.className = "session-time";
        time.textContent = item.time || "";

        const preview = document.createElement("div");
        preview.className = "session-preview";
        preview.textContent = item.preview || "";
        row.append(nameWrap, time, preview);
        row.addEventListener("click", () => selectSession(item.name));
        elements.sessionList.append(row);
      }
    }

    async function loadSessions(force = false) {
      if (!force) {
        const cachedItems = readSessionCache();
        if (cachedItems) {
          state.sessions = cachedItems;
          renderSessions();
          return;
        }
      }
      if (state.sessionsLoading) return;
      state.sessionsLoading = true;
      setBusy(elements.sessions, true, "加载中...");
      elements.sessionList.replaceChildren();
      for (let index = 0; index < 7; index += 1) {
        const skeleton = document.createElement("li");
        skeleton.className = "skeleton";
        skeleton.innerHTML = '<div class="skeleton-line" style="width: 70%"></div><div class="skeleton-line" style="width: 92%"></div>';
        elements.sessionList.append(skeleton);
      }
      try {
        const data = await request("/api/v1/sessions");
        state.sessions = data.items || [];
        writeSessionCache(state.sessions);
      } catch (error) {
        state.sessions = [];
        showError(error);
      } finally {
        state.sessionsLoading = false;
        setBusy(elements.sessions, false, "刷新会话");
        renderSessions();
      }
    }

    function selectSession(name) {
      state.selectedSession = name;
      elements.selectedSession.textContent = name;
      elements.sendTargetName.textContent = name;
      elements.sendText.focus();
      renderSessions();
    }

    function renderListenerSessions() {
      elements.listenerList.replaceChildren();
      if (!state.listenerSessions.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "未配置监听";
        elements.listenerList.append(empty);
        return;
      }
      for (const item of state.listenerSessions) {
        const row = document.createElement("li");
        row.className = "listener-item";
        const name = document.createElement("div");
        name.className = "listener-name";
        name.textContent = item.name;
        const type = document.createElement("span");
        type.className = `tag ${item.type || ""}`;
        type.textContent = item.type === "group" ? "群聊" : item.type === "friend" ? "私聊" : "未知";
        const remove = document.createElement("button");
        remove.className = "danger";
        remove.type = "button";
        remove.textContent = "移除";
        remove.addEventListener("click", async () => {
          try {
            await request(`/api/v1/listener/sessions/${encodeURIComponent(item.name)}`, { method: "DELETE" });
            await refreshListenerSessions();
            await refreshHealth();
          } catch (error) {
            showError(error);
          }
        });
        row.append(name, type, remove);
        elements.listenerList.append(row);
      }
    }

    async function refreshListenerSessions() {
      try {
        const data = await request("/api/v1/listener/sessions");
        state.listenerSessions = data.items || [];
      } catch (error) {
        state.listenerSessions = [];
        showError(error);
      }
      renderListenerSessions();
    }

    async function addListenerSession() {
      const name = elements.listenerName.value.trim();
      if (!name) return;
      try {
        await post("/api/v1/listener/sessions", { name });
        elements.listenerName.value = "";
        await Promise.all([refreshListenerSessions(), refreshHealth()]);
      } catch (error) {
        showError(error);
      }
    }

    function closeSessionContextMenu() {
      elements.contextMenu.classList.remove("open");
      state.contextSession = "";
    }

    function openSessionContextMenu(event, name) {
      const listening = state.listenerSessions.some(item => item.name === name);
      const online = state.health?.online === true;
      state.contextSession = name;
      elements.contextAdd.disabled = !online || listening;
      elements.contextRemove.disabled = !online || !listening;
      elements.contextMenu.classList.add("open");

      const rect = elements.contextMenu.getBoundingClientRect();
      const left = Math.min(event.clientX, window.innerWidth - rect.width - 8);
      const top = Math.min(event.clientY, window.innerHeight - rect.height - 8);
      elements.contextMenu.style.left = `${Math.max(8, left)}px`;
      elements.contextMenu.style.top = `${Math.max(8, top)}px`;
    }

    async function addListenerByName(name) {
      if (!name) return;
      closeSessionContextMenu();
      try {
        await post("/api/v1/listener/sessions", { name });
        await Promise.all([refreshListenerSessions(), refreshHealth()]);
      } catch (error) {
        showError(error);
        await refreshHealth();
      }
    }

    async function removeListenerByName(name) {
      if (!name) return;
      closeSessionContextMenu();
      try {
        await request(`/api/v1/listener/sessions/${encodeURIComponent(name)}`, { method: "DELETE" });
        await Promise.all([refreshListenerSessions(), refreshHealth()]);
      } catch (error) {
        showError(error);
        await refreshHealth();
      }
    }

    async function controlListener(action) {
      try {
        await post(`/api/v1/listener/${action}`);
        await refreshHealth();
      } catch (error) {
        showError(error);
        await refreshHealth();
      }
    }

    function formatTime(value) {
      try {
        return new Date(value).toLocaleString("zh-CN", { hour12: false });
      } catch (_) {
        return value || "";
      }
    }

    function renderMessages() {
      const items = state.messages;
      elements.messageStream.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "暂无消息";
        elements.messageStream.append(empty);
        return;
      }
      for (const item of items) {
        const row = document.createElement("div");
        row.className = "message-row";
        if (item.is_at_me) row.classList.add("at-me");

        const meta = document.createElement("div");
        meta.className = "message-meta";
        const session = document.createElement("span");
        session.className = "message-session";
        session.textContent = item.session;
        meta.append(session);
        if (item.session_type === "group") {
          const type = document.createElement("span");
          type.className = "tag group";
          type.textContent = "群聊";
          meta.append(type);
        }
        if (item.is_at_me) {
          const at = document.createElement("span");
          at.className = "tag at-me";
          at.textContent = "@我";
          meta.append(at);
        }
        const sender = document.createElement("span");
        sender.textContent = item.sender || "未知";
        const time = document.createElement("span");
        time.textContent = formatTime(item.received_at);
        meta.append(sender, time);

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = item.content;
        row.append(meta, bubble);
        elements.messageStream.append(row);
      }
      elements.messageStream.scrollTop = elements.messageStream.scrollHeight;
    }

    function appendMessages(items) {
      if (!items?.length) return;
      const known = new Set(state.messages.map(item => item.id));
      state.messages.push(...items.filter(item => !known.has(item.id)));
      if (state.messages.length > 500) state.messages = state.messages.slice(-500);
      renderMessages();
    }

    async function pollMessages() {
      if (state.messagePolling) return;
      state.messagePolling = true;
      while (true) {
        try {
          const query = new URLSearchParams({ cursor: state.cursor, limit: 100, timeout: 25 });
          const data = await request(`/api/v1/messages?${query}`);
          appendMessages(data.items);
          state.cursor = data.next_cursor;
          elements.messageState.textContent = data.has_more ? "继续同步" : "等待新消息";
        } catch (error) {
          elements.messageState.textContent = "消息同步失败";
          showError(error);
          await new Promise(resolve => setTimeout(resolve, 3000));
        }
      }
    }

    function renderTasks() {
      const items = [...state.tasks.values()].sort((a, b) => String(b.submitted_at).localeCompare(String(a.submitted_at)));
      elements.taskCount.textContent = String(items.length);
      elements.taskList.replaceChildren();
      if (!items.length) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "暂无任务";
        elements.taskList.append(empty);
        return;
      }
      for (const task of items) {
        const row = document.createElement("li");
        row.className = "task-item";
        const status = document.createElement("span");
        status.className = `task-status ${task.status}`;
        status.textContent = { queued: "排队", running: "发送中", success: "成功", failed: "失败" }[task.status] || task.status;
        const detail = document.createElement("div");
        detail.className = "task-detail";
        detail.textContent = `${task.session}：${task.text}`;
        detail.title = `${task.session}：${task.text}`;
        const result = document.createElement("div");
        result.className = "task-detail";
        if (task.error_message) {
          result.textContent = task.error_message;
          result.classList.add("error");
        } else {
          result.textContent = task.completed_at ? formatTime(task.completed_at) : formatTime(task.submitted_at);
        }
        row.append(status, detail, result);
        elements.taskList.append(row);
      }
    }

    function upsertTask(task) {
      state.tasks.set(task.task_id, task);
      renderTasks();
    }

    function pollSendTask(taskId) {
      setTimeout(async () => {
        try {
          const task = await request(`/api/v1/send/${taskId}`);
          upsertTask(task);
          if (task.status === "queued" || task.status === "running") pollSendTask(taskId);
        } catch (error) {
          const task = state.tasks.get(taskId);
          if (task && (task.status === "queued" || task.status === "running")) {
            upsertTask({ ...task, status: "failed", completed_at: new Date().toISOString(), error_message: error.message });
          }
        }
      }, 1000);
    }

    async function sendMessage() {
      const session = state.selectedSession;
      const text = elements.sendText.value.trim();
      if (!session || !text) return;
      try {
        const queued = await post("/api/v1/send", { session, text });
        upsertTask({ ...queued, session, text, submitted_at: new Date().toISOString() });
        elements.sendText.value = "";
        pollSendTask(queued.task_id);
      } catch (error) {
        showError(error);
      }
    }

    elements.attach.addEventListener("click", attach);
    elements.sessions.addEventListener("click", () => loadSessions(true));
    elements.sessionSearch.addEventListener("input", renderSessions);
    elements.sessionList.addEventListener("contextmenu", event => {
      const row = event.target.closest(".session-item[data-name]");
      if (!row) return;
      event.preventDefault();
      openSessionContextMenu(event, row.dataset.name);
    });
    elements.contextAdd.addEventListener("click", () => addListenerByName(state.contextSession));
    elements.contextRemove.addEventListener("click", () => removeListenerByName(state.contextSession));
    document.addEventListener("click", closeSessionContextMenu);
    document.addEventListener("contextmenu", event => {
      if (!event.target.closest("#session-list")) closeSessionContextMenu();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeSessionContextMenu();
    });
    window.addEventListener("resize", closeSessionContextMenu);
    window.addEventListener("scroll", closeSessionContextMenu, true);
    elements.listenerAdd.addEventListener("click", addListenerSession);
    elements.listenerName.addEventListener("keydown", event => {
      if (event.key === "Enter") addListenerSession();
    });
    elements.listenerStart.addEventListener("click", () => controlListener("start"));
    elements.listenerStop.addEventListener("click", () => controlListener("stop"));
    elements.send.addEventListener("click", sendMessage);
    elements.sendText.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.ctrlKey && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
    elements.closeError.addEventListener("click", clearError);
    document.querySelectorAll(".segmented button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".segmented button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        state.sessionFilter = button.dataset.filter;
        renderSessions();
      });
    });

    renderMessages();
    renderTasks();
    refreshHealth();
    refreshListenerSessions();
    loadSessions();
    pollMessages();
    setInterval(refreshHealth, 5000);
  </script>
</body>
</html>
